<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Agenda para listar y guardar contactos.">
  <title>Agenda de contactos</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/agenda.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Agenda, inicio"><span aria-hidden="true">A</span> Agenda</a>
    <span class="course">Programación Web · Tarea 5</span>
  </header>
  <main>
    <div class="intro">
      <h1>Tu agenda de contactos.</h1>
      <p>Guarda un contacto y encuentra sus datos cuando los necesites.</p>
    </div>
    <div class="workspace">
      <section class="form-panel" aria-labelledby="form-title">
        <h2 id="form-title">Agregar contacto</h2>
        <p>Completa el nombre, apellido y teléfono.</p>
        <form id="contact-form">
          <label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" autocomplete="given-name" maxlength="100" placeholder="Ej. Ana" required>
          <label for="apellido">Apellido</label>
          <input id="apellido" name="apellido" autocomplete="family-name" maxlength="100" placeholder="Ej. Pérez" required>
          <label for="telefono">Teléfono</label>
          <input id="telefono" name="telefono" type="tel" autocomplete="tel" maxlength="30" placeholder="Ej. 809-555-1234" required>
          <button id="save-button" type="submit">Guardar contacto</button>
          <p id="form-status" role="status"></p>
        </form>
      </section>
      <section class="contacts-panel" aria-labelledby="contacts-title">
        <div class="contacts-heading">
          <h2 id="contacts-title">Contactos <span id="count">0</span></h2>
          <button id="refresh-button" class="secondary" type="button">Actualizar lista</button>
        </div>
        <label for="search">Buscar por nombre, apellido o teléfono</label>
        <input id="search" type="search" placeholder="Buscar contacto…" autocomplete="off">
        <p id="list-status" role="status">Cargando contactos…</p>
        <ul id="contact-list" aria-label="Contactos guardados"></ul>
      </section>
    </div>
  </main>
  <footer>Maxwel Kenen Sael Soriano · 2025-1984</footer>
  <noscript>Activa JavaScript en el navegador para consultar y guardar contactos.</noscript>
</body>
</html>
